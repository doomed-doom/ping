[package]
name = "ping"
version = "0.1.0"
edition = "2024"
authors = ["Гуль Меллстрой", "Антейку anteikucafe@gmail.com"]
description = "Реализация CLI ping на Rust."

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
ctrlc = "3.4.7"
mio = { version = "1.2.4", features = ["os-poll", "net"] }
socket2 = { version = "0.6.0", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt"] }
